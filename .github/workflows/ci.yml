# CI: build and test only. No AI review here (docs/DECISIONS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Block real sensor traces (raw coordinates)
        run: |
          bad=$(git ls-files fixtures/traces | grep -vE "^fixtures/traces/(synthetic_[^/]+|.gitkeep)$" || true)
          if [ -n "$bad" ]; then echo "Only synthetic_ traces may be committed:"; echo "$bad"; exit 1; fi
      - name: Synthetic traces stay inside the synthetic coordinate box
        run: node .github/scripts/check-synthetic-traces.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --passWithNoTests --ci

  swift-core:
    name: Detection core (swift test)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26+
        run: ./.github/scripts/select-xcode.sh
      - name: Swift version
        run: swift --version
      - name: Test state machine
        working-directory: modules/carcrumb-detection
        run: swift test

  ios-build:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    needs: [js, swift-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Select newest Xcode 26+
        run: ./.github/scripts/select-xcode.sh
      - name: Generate native project
        run: npx expo prebuild -p ios --no-install --clean
      - name: Install pods
        working-directory: ios
        # One retry: React Native artifact downloads occasionally reset mid-transfer.
        run: pod install || { echo "pod install failed, retrying once"; pod install; }
      - name: Debug trace recording is compiled out of Release
        # TraceRecorder is guarded by `#if DEBUG`; the Release pod target must not define DEBUG.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          # The pod target has an SPM dependency (GRDB), so query it through the workspace
          # (packages resolve there); fall back to the Pods project. Errors stay visible.
          settings() {
            xcodebuild -workspace "$WORKSPACE" -scheme CarCrumbDetection -configuration "$1" -showBuildSettings \
              || xcodebuild -project ios/Pods/Pods.xcodeproj -target CarCrumbDetection -configuration "$1" -showBuildSettings
          }
          flags() {
            settings "$1" | awk -F' = ' '/ SWIFT_ACTIVE_COMPILATION_CONDITIONS = /{print $2; exit}'
          }
          REL=$(flags Release); DBG=$(flags Debug)
          echo "Release: '$REL'  Debug: '$DBG'"
          if echo " $REL " | grep -qw DEBUG; then echo "DEBUG is defined in Release"; exit 1; fi
          if ! echo " $DBG " | grep -qw DEBUG; then echo "DEBUG missing in Debug"; exit 1; fi
      - name: Build (no signing)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200
